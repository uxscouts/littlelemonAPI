<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Lemon Restaurant API</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 500px;
        }
        h1 {
            color: #495E57; /* Little Lemon Green */
            margin-bottom: 0.5rem;
        }
        p {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        .badge {
            background-color: #F4CE14; /* Little Lemon Yellow */
            color: #333;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .links {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .btn {
            text-decoration: none;
            color: white;
            background-color: #495E57;
            padding: 0.7rem 1.2rem;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #33423d;
        }
        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">Status: Online & Ready</span>
        <h1>Little Lemon API</h1>
        <p>Your backend database models and endpoints are successfully configured.</p>
        
        <div class="links">
            <a href="/admin/" class="btn">Go to Django Admin</a>
            <a href="/api/" class="btn btn-secondary">Browse API Endpoints</a>
        </div>
    </div>

</body>
</html>
